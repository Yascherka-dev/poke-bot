<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Pokémon 30 ans</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8e8ec; --muted:#9aa1ad;
          --ok:#3ddc84; --warn:#ffb347; --bad:#ff5c5c; --unknown:#8a8f9c; --accent:#ffcb05; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; } h1 span { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:10px 16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  main { padding:16px 20px; max-width:1200px; margin:0 auto; }
  .banner { padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:14px; }
  .banner.warn { background:#3a2c10; color:var(--warn); } .banner.bad { background:#3a1616; color:var(--bad); } .banner.hidden { display:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .card h2 { margin:0 0 6px; font-size:15px; } .card h2 a { color:inherit; text-decoration:none; } .card h2 a:hover { text-decoration:underline; }
  .status { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.3px; }
  .DISPONIBLE_WEB { background:var(--ok); color:#062; } .DISPONIBLE_MAGASIN { background:#1f6f45; color:#dfffe9; }
  .INDISPONIBLE { background:#3a1616; color:var(--bad); } .INCONNU { background:#2a2f3a; color:var(--unknown); }
  .price { float:right; font-weight:700; color:var(--accent); }
  .stores { margin:8px 0 0; padding:0; list-style:none; font-size:13px; } .stores li { padding:2px 0; color:var(--muted); }
  .stores li.priority { color:var(--ok); font-weight:700; }
  .small { color:var(--muted); font-size:12px; margin-top:8px; } .err { color:var(--bad); }
  pre { background:#0a0c10; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12px; overflow:auto; max-height:320px; color:#c9d1d9; }
  @media (max-width:600px) { header { padding:14px 16px; } main { padding:12px 16px; } .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Radar <span>Pokémon 30 ans</span></h1>
    <div class="meta" id="meta">Connexion…</div>
  </div>
  <div>
    <button id="refresh">Rafraîchir maintenant</button>
    <div class="meta" id="refresh-hint"></div>
  </div>
</header>
<main>
  <div id="banner" class="banner hidden"></div>
  <div class="grid" id="products"></div>
  <h3>Journal</h3>
  <pre id="log"></pre>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = iso => iso ? new Date(iso).toLocaleString('fr-FR') : '–';
  const ago = iso => { if (!iso) return '–'; const s = Math.round((Date.now() - new Date(iso)) / 1000); return s < 60 ? s + ' s' : Math.round(s / 60) + ' min'; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let last = null;

  function render(data) {
    last = data;
    const r = data.radar;
    $('meta').textContent = `${r.stores_watched} magasins · intervalle ${r.interval_seconds} s · cycle ${r.cycles} · dernier passage il y a ${ago(r.last_cycle_at)} · prochain ${fmt(r.next_cycle_at)}`;
    const b = $('banner'); b.className = 'banner hidden'; b.textContent = '';
    if (!r.ntfy_configured) { b.className = 'banner bad'; b.textContent = 'NTFY_TOPIC absent dans .env : aucune notification ne partira.'; }
    else if (r.blocked) { b.className = 'banner warn'; b.textContent = 'Le site a répondu 403/429/502 ou timeout au dernier cycle : cadence ralentie, stock magasin peut-être inconnu.'; }
    else if (r.consecutive_failed_cycles > 0) { b.className = 'banner warn'; b.textContent = `${r.consecutive_failed_cycles} cycle(s) consécutif(s) en erreur.`; }
    $('products').innerHTML = data.products.map(p => {
      const stores = p.stores.length
        ? `<ul class="stores">${p.stores.map(s => `<li class="${s.priority ? 'priority' : ''}">${esc(s.name)}</li>`).join('')}</ul>`
        : `<div class="small">${p.stores_known ? 'Aucun magasin surveillé ne l’a en stock.' : 'Stock magasin inconnu (API injoignable).'}</div>`;
      const price = p.price == null ? '' : p.price.toFixed(2).replace('.', ',') + ' €';
      return `<div class="card">
        <span class="price">${price}</span>
        <h2><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title || p.url)}</a></h2>
        <span class="status ${p.status}">${p.status.replace('_', ' ')}</span>
        <span class="small"> web : ${p.web_available === true ? 'disponible' : p.web_available === false ? 'rupture' : 'inconnu'}</span>
        ${stores}
        <div class="small">Vérifié il y a ${ago(p.last_checked)} · changement : ${fmt(p.last_change)}${p.last_error ? `<br><span class="err">${esc(p.last_error)}</span> (${p.consecutive_errors} d’affilée)` : ''}</div>
      </div>`;
    }).join('') || '<div class="small">Aucun produit encore observé. Le premier cycle arrive.</div>';
    $('log').textContent = data.log.join('\n');
    $('refresh').disabled = r.refresh_available_in > 0;
    $('refresh-hint').textContent = r.refresh_available_in > 0 ? `disponible dans ${r.refresh_available_in} s` : '';
  }

  async function load() { try { render(await (await fetch('/api/state')).json()); } catch (e) { $('meta').textContent = 'Radar injoignable.'; } }

  $('refresh').addEventListener('click', async () => {
    $('refresh').disabled = true;
    const res = await fetch('/api/refresh', { method: 'POST' });
    const body = await res.json();
    $('refresh-hint').textContent = body.ok ? 'Cycle lancé…' : `patiente ${body.retry_in} s`;
    setTimeout(load, 1500);
  });

  function connect() {
    const es = new EventSource('/api/events');
    es.onmessage = ev => render(JSON.parse(ev.data));
    es.onerror = () => { es.close(); setTimeout(connect, 5000); };
  }
  load(); connect();
  setInterval(() => { if (last) render(last); }, 15000);
})();
</script>
</body>
</html>
